# GitHub Actions: 自动打包分发
#
# 触发条件：推送 v* tag（如 v0.4.0）
# 构建 Windows 和 Linux 产物并发布到 GitHub Releases
#
# GITHUB_TOKEN 由 GitHub Actions 自动提供，无需手动配置

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-windows-x64:
    name: build (windows-latest, win, x64, --x64)
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # 构建应用
      - name: 构建 Electron 应用
        run: bun run electron:build
        working-directory: .

      - name: 打包 (Windows)
        run: |
          mkdir -p out/@proma
          npx electron-builder --win --x64
        working-directory: apps/electron

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: apps/electron/out/@proma/*.exe
          retention-days: 30

  build-linux-x64:
    name: build (ubuntu-latest, linux, x64, --linux)
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rpm
          sudo gem install fpm

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # 构建应用
      - name: 构建 Electron 应用
        run: bun run electron:build
        working-directory: .

      - name: 打包 (Linux x64)
        run: |
          mkdir -p out/@proma
          npx electron-builder --linux --x64
        working-directory: apps/electron

      - name: 上传 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: apps/electron/out/@proma/*.AppImage
          retention-days: 30

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: apps/electron/out/@proma/*.deb
          retention-days: 30

      - name: 上传 rpm
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: apps/electron/out/@proma/*.rpm
          retention-days: 30
