# electron-builder 配置
# 文档: https://www.electron.build/configuration/configuration

appId: com.proma.app
productName: Proma
copyright: Copyright © 2024-2026 Erlich Liu
publish: null
# 注意：这里不要用全局 artifactName。
# 原配置用 `${name}` 会展开成作用域名 `@proma/electron`，产物落到 out/@proma/
# 且文件名是 electron-<版本>-<架构>.exe，与发行说明的 Proma-* 命名不一致。
# 各平台在下方用 `${productName}` 单独覆盖，保持与官方发行产物同名。

# Electron 版本（CI 环境 bun workspace 下无法自动检测，需显式指定）
electronVersion: 43.2.0

# 目录配置
directories:
  output: out
  buildResources: resources

# 压缩配置
compression: normal

# Electron 语言包：默认会把 55 种 locale 全打进安装包（未压缩 46MB / xz 后约 7.6MB）。
# Electron 在缺少系统语言包时会回退 en-US，应用自身的 i18n 不受影响，因此只保留实际
# 面向的语言即可。需要新增语言时在这里补。
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
  - ja
  - ko

# ASAR 打包配置
# 启用 ASAR 归档，将 Pi native addon 解压到 app.asar.unpacked/ 避免路径问题
asar: true
asarUnpack:
  - "node_modules/@silvia-odwyer/**"
  - "node_modules/@mariozechner/**"
  - "node_modules/@napi-rs/**"
  - "node_modules/@earendil-works/pi-tui/native/**"

# 跳过 npm install（代码已被 esbuild/Vite 打包，npm 不识别 workspace:* 协议）
npmRebuild: false

# 通用文件配置
files:
  - dist/**/*
  # 排除 build:resources 脚本拷到 dist/resources 的副本（electron-builder 已通过
  # buildResources 从 resources/ 直接使用 icon/plist，避免产物里重复打包一份）
  - "!dist/resources/**"
  - package.json
  # Pi runtime 作为主进程 external 运行。打包前 sync:runtime-deps 会
  # 将 external 依赖闭包同步到 apps/electron/node_modules。
  - node_modules/**/*
  # 排除 workspace 包的 symlink（代码已被 esbuild/Vite 打包到 dist/ 中）
  - "!node_modules/@proma/**"
  # 排除明确只在开发/构建期使用的大体积包。
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/electronmon/**"
  - "!node_modules/esbuild/**"
  - "!node_modules/@electron/**"
  - "!node_modules/@electron-builder/**"
  - "!node_modules/@esbuild/**"
  # 排除 Pi SDK 纯演示/文档/sourcemap 内容，保留运行时必需文件。
  - "!node_modules/@earendil-works/*/examples/**"
  - "!node_modules/@earendil-works/*/docs/**"
  - "!node_modules/@earendil-works/**/*.map"
  # 排除 musl 变体原生包。Electron 官方二进制本身就依赖 glibc，deb/rpm/AppImage/
  # dmg/nsis 都用不上 musl（@napi-rs/canvas 的 musl Skia 单文件就 30MB，xz 后 ~9MB）。
  # sync-runtime-deps 已按目标平台过滤，这里再兜一层，防止本地 node_modules 混入。
  - "!**/*-musl/**"

# 通用额外资源
extraResources:
  # proma CLI 运行时（build:cli 产出到 resources/bin/）：
  # - 非 Windows：proma-cli.cjs + proma 包装脚本（用 Electron 的 Node 模式运行，
  #   不再单独打包一份 Bun 运行时，见 scripts/build-cli.ts）
  # - Windows：proma.exe 自包含二进制（WSL 只能执行 PE 可执行文件）
  # 运行时由主进程注入 PROMA_CLI 环境变量，暴露给 skill / Agent 调用。
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  # 默认 Skills 模板（首次启动时同步到 ~/.proma/default-skills/）
  - from: default-skills
    to: default-skills
    filter:
      - "**/*"
  # 教程文件（教程查看器 + 欢迎对话使用）
  - from: ../../docs/tutorial/tutorial-v2.md
    to: tutorial.md
  # Proma 品牌 Logo 素材（托盘 Template 图标使用）
  - from: resources/proma-logos
    to: proma-logos
    filter:
      - "**/*"
  # 应用窗口图标（BrowserWindow.icon）。asar 内的 dist/resources 被 files 规则排除，
  # 故必须显式输出到 process.resourcesPath 根目录，getIconPath() 才能解析到。
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.icns
    to: icon.icns

# ============================================
# Windows 配置
# ============================================
win:
  icon: resources/icon.ico
  fileAssociations:
    - ext: proma-backup
      name: Proma Personal Backup
      icon: resources/icon.ico
    - ext: proma-share
      name: Proma Share Package
      icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64

# NSIS 安装程序配置
nsis:
  # Windows 安装包命名与发行说明一致：Proma-Setup-<版本>.exe
  artifactName: "${productName}-Setup-${version}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# ============================================
# Linux 配置
# ============================================
linux:
  # Linux 产物统一为 Proma-<版本>-<架构>.<ext>（AppImage / deb / rpm）
  artifactName: "${productName}-${version}-${arch}.${ext}"
  executableName: proma
  icon: resources/icon.icns
  category: Development
  # 刻意不写 arch 数组：不指定时 electron-builder 按宿主架构打包。
  # 交叉架构打包会产出「杂交包」（Electron 本体是目标架构，但 node_modules 里的
  # 原生依赖与 CLI 仍是宿主架构）——0.16.11 的 arm64 包就是这样，里面的 canvas
  # Skia 与 CLI 与 amd64 包逐字节相同，既白占 ~17MB 也加载不了。
  # arm64 产物由 .github/workflows/release.yml 的 linux-arm64 job 在同架构 runner
  # 上用 `electron-builder --linux --arm64` 显式构建。
  target:
    - AppImage
    - deb
    - rpm
  fileAssociations:
    - ext: proma-backup
      name: Proma Personal Backup
      role: Editor
    - ext: proma-share
      name: Proma Share Package
      role: Editor

# Deb 配置
deb:
  packageName: proma
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  recommends:
    - libappindicator3-1
  priority: optional
  compression: xz

# RPM 配置
rpm:
  packageName: proma
  depends:
    - gtk3
    - libnotify
    - nss
    - libXtst
    - libXScrnSaver
    - xdg-utils
    - at-spi2-atk
    - libuuid
    - libsecret
  compression: xz

# AppImage 配置
appImage:
  license: LICENSE

# 发布配置已移除 - 产物通过 GitHub Actions Artifacts 保存
